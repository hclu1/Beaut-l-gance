<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://lumi.new/lumi.ing/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    
    <!-- Mode plein écran sur mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Beauté&Élégance">
    
    <title>Beauté & Élégance - Boutique de Cosmétiques</title>
    <meta name="description" content="Découvrez notre collection exclusive de produits de beauté et cosmétiques de luxe">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Script de débogage PRÉCIS -->
    <script>
      window.addEventListener('error', function(e) {
        let errorMsg = e.message;
        let errorFile = e.filename || "Inconnu";
        
        console.error("🔴 DETAILS ERREUR :");
        console.error("Message:", errorMsg);
        console.error("Fichier:", errorFile);
        console.error("Ligne:", e.lineno);

        alert("ERREUR DANS : " + errorFile + "\nMessage: " + errorMsg);
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        console.error("🔴 PROMISE REJECTED:", e.reason);
        alert("Erreur asynchrone : " + e.reason);
      });
    </script>
  </body>
</html>
